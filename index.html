<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ريم الوادي | عقارات الرياض</title>

  <script src='https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js'></script>
  <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css' rel='stylesheet' />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: #f7f5f0;
      color: #2a2a2a;
    }

    /* الهيدر */
    header {
      background: linear-gradient(135deg, #1a3a2e 0%, #2d5a45 100%);
      color: white;
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 45px;
      height: 45px;
      background: #d4af37;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      color: #1a3a2e;
    }

    .logo-text h1 {
      font-size: 22px;
      font-weight: 900;
    }

    .logo-text p {
      font-size: 12px;
      opacity: 0.85;
    }

    .contact-btn {
      background: #d4af37;
      color: #1a3a2e;
      padding: 10px 24px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      transition: 0.3s;
      font-size: 14px;
    }

    .contact-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
    }

    /* الهيرو */
    .hero {
      background: linear-gradient(135deg, #1a3a2e 0%, #2d5a45 100%);
      color: white;
      padding: 50px 40px 40px;
      text-align: center;
    }

    .hero h2 {
      font-size: 38px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 17px;
      opacity: 0.9;
      max-width: 600px;
      margin: 0 auto;
    }

    /* الفلاتر */
    .filters {
      max-width: 1200px;
      margin: -25px auto 0;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      position: relative;
      z-index: 10;
    }

    .filters select,
    .filters input {
      flex: 1;
      min-width: 150px;
      padding: 12px 16px;
      border: 2px solid #e8e4da;
      border-radius: 10px;
      font-family: 'Tajawal';
      font-size: 14px;
      background: #fafaf7;
      cursor: pointer;
    }

    .filters select:focus,
    .filters input:focus {
      outline: none;
      border-color: #d4af37;
    }

    /* الخريطة */
    #map {
      width: 100%;
      height: 500px;
      margin-top: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .map-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* قائمة العقارات */
    .section-title {
      text-align: center;
      font-size: 28px;
      font-weight: 900;
      margin: 50px 0 25px;
      color: #1a3a2e;
    }

    .section-title::after {
      content: '';
      display: block;
      width: 60px;
      height: 4px;
      background: #d4af37;
      margin: 10px auto 0;
      border-radius: 2px;
    }

    .properties {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 60px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      transition: 0.3s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    }

    .card-img {
      height: 200px;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .card-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #d4af37;
      color: #1a3a2e;
      padding: 5px 14px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 700;
    }

    .card-body {
      padding: 18px;
    }

    .card-body h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #1a3a2e;
    }

    .card-body .price {
      font-size: 22px;
      font-weight: 900;
      color: #2d5a45;
      margin-bottom: 10px;
    }

    .card-info {
      display: flex;
      gap: 15px;
      font-size: 13px;
      color: #777;
      margin-bottom: 12px;
    }

    .card-info span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-btn {
      display: block;
      text-align: center;
      padding: 10px;
      background: #1a3a2e;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      transition: 0.3s;
    }

    .card-btn:hover {
      background: #d4af37;
      color: #1a3a2e;
    }

    /* واتساب عائم */
    .whatsapp-float {
      position: fixed;
      bottom: 25px;
      left: 25px;
      width: 60px;
      height: 60px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 20px rgba(37, 211, 102, 0.4);
      z-index: 999;
      transition: 0.3s;
      text-decoration: none;
    }

    .whatsapp-float:hover {
      transform: scale(1.1);
    }

    .whatsapp-float svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    /* الفوتر */
    footer {
      background: #1a3a2e;
      color: white;
      padding: 30px 20px;
      text-align: center;
      font-size: 14px;
    }

    footer a {
      color: #d4af37;
      text-decoration: none;
    }

    /* النافذة المنبثقة */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-content img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .modal-body {
      padding: 22px;
    }

    .modal-body h3 {
      font-size: 22px;
      margin-bottom: 10px;
      color: #1a3a2e;
    }

    .modal-body .price {
      font-size: 26px;
      font-weight: 900;
      color: #2d5a45;
      margin-bottom: 15px;
    }

    .modal-body p {
      color: #555;
      margin-bottom: 15px;
      line-height: 1.7;
    }

    .modal-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .modal-info div {
      background: #f7f5f0;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
    }

    .modal-info strong {
      display: block;
      color: #1a3a2e;
      font-size: 15px;
      margin-top: 3px;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      border: none;
      cursor: pointer;
      font-size: 20px;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      header {
        padding: 15px 20px;
      }

      .logo-text h1 {
        font-size: 18px;
      }

      .contact-btn {
        padding: 8px 16px;
        font-size: 12px;
      }

      .hero h2 {
        font-size: 26px;
      }

      .hero {
        padding: 35px 20px;
      }

      #map {
        height: 400px;
      }
    }
  </style>
</head>

<body>

  <!-- الهيدر -->
  <header>
    <div class="logo">
      <div class="logo-icon">ر</div>
      <div class="logo-text">
        <h1>ريم الوادي</h1>
        <p>للعقارات - الرياض</p>
      </div>
    </div>
    <a href="https://wa.me/966552500035" class="contact-btn">تواصل معنا</a>
  </header>

  <!-- الهيرو -->
  <section class="hero">
    <h2>عقارات الرياض بين يديك</h2>
    <p>نوفر لك أفضل العقارات في مدينة الرياض بخريطة تفاعلية تسهل عليك البحث والاختيار</p>
  </section>

  <!-- الفلاتر -->
  <div class="filters">
    <select id="filterType">
      <option value="">كل الأنواع</option>
      <option value="شقة">شقة</option>
      <option value="فيلا">فيلا</option>
      <option value="أرض">أرض</option>
      <option value="مكتب">مكتب</option>
      <option value="محل">محل تجاري</option>
    </select>
    <select id="filterDistrict">
      <option value="">كل الأحياء</option>
      <option value="العليا">العليا</option>
      <option value="الملز">الملز</option>
      <option value="النخيل">النخيل</option>
      <option value="المروج">المروج</option>
      <option value="حي الصحافة">الصحافة</option>
      <option value="الربيع">الربيع</option>
      <option value="الياسمين">الياسمين</option>
      <option value="قرطبة">قرطبة</option>
    </select>
    <select id="filterPrice">
      <option value="">كل الأسعار</option>
      <option value="0-500000">أقل من 500 ألف</option>
      <option value="500000-1000000">500 ألف - مليون</option>
      <option value="1000000-3000000">مليون - 3 مليون</option>
      <option value="3000000-99999999">أكثر من 3 مليون</option>
    </select>
  </div>

  <!-- الخريطة -->
  <div class="map-wrapper">
    <div id="map"></div>
  </div>

  <!-- العقارات -->
  <h2 class="section-title">عقاراتنا المتاحة</h2>
  <div class="properties" id="propertiesList"></div>

  <!-- الفوتر -->
  <footer>
    <p>© 2026 <strong>ريم الوادي للعقارات</strong> - جميع الحقوق محفوظة</p>
    <p style="margin-top:8px">واتساب: <a href="https://wa.me/966552500035">0552500035</a></p>
  </footer>

  <!-- زر واتساب عائم -->
  <a href="https://wa.me/966552500035" class="whatsapp-float" target="_blank">
    <svg viewBox="0 0 24 24">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z" />
    </svg>
  </a>

  <!-- نافذة تفاصيل العقار -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">×</button>
      <img id="modalImg" src="" alt="">
      <div class="modal-body">
        <h3 id="modalTitle"></h3>
        <div class="price" id="modalPrice"></div>
        <p id="modalDesc"></p>
        <div class="modal-info">
          <div>النوع<strong id="modalType"></strong></div>
          <div>المساحة<strong id="modalArea"></strong></div>
          <div>الحي<strong id="modalDistrict"></strong></div>
          <div>الغرف<strong id="modalRooms"></strong></div>
        </div>
        <a href="#" id="modalWhatsapp" class="card-btn" target="_blank">تواصل عبر واتساب</a>
      </div>
    </div>
  </div>

  <script>
    // ====== بيانات العقارات (عدّل عليها لاحقاً) ======
    const properties = [{
        id: 1,
        title: "شقة فاخرة في حي العليا",
        type: "شقة",
        district: "العليا",
        price: 850000,
        area: 180,
        rooms: 3,
        coords: [46.6857, 24.6935],
        image: "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=800",
        desc: "شقة حديثة بتشطيب فاخر، قريبة من الخدمات والمراكز التجارية، إطلالة رائعة."
      },
      {
        id: 2,
        title: "فيلا مستقلة في حي النخيل",
        type: "فيلا",
        district: "النخيل",
        price: 2800000,
        area: 400,
        rooms: 5,
        coords: [46.6388, 24.7545],
        image: "https://images.unsplash.com/photo-1613490493576-7fde63acd811?w=800",
        desc: "فيلا واسعة بتصميم عصري، حديقة خاصة، مواقف سيارات، موقع مميز."
      },
      {
        id: 3,
        title: "مكتب تجاري في الملز",
        type: "مكتب",
        district: "الملز",
        price: 1200000,
        area: 120,
        rooms: 2,
        coords: [46.7269, 24.6752],
        image: "https://images.unsplash.com/photo-1497366216548-37526070297c?w=800",
        desc: "مكتب مجهز بالكامل في برج تجاري، موقع حيوي، مناسب للشركات."
      },
      {
        id: 4,
        title: "أرض للبيع في حي المروج",
        type: "أرض",
        district: "المروج",
        price: 750000,
        area: 500,
        rooms: 0,
        coords: [46.6641, 24.7419],
        image: "https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=800",
        desc: "أرض سكنية في موقع ممتاز، جميع الخدمات متوفرة، مناسبة للبناء."
      },
      {
        id: 5,
        title: "شقة عصرية في حي الياسمين",
        type: "شقة",
        district: "الياسمين",
        price: 620000,
        area: 140,
        rooms: 3,
        coords: [46.6345, 24.8271],
        image: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=800",
        desc: "شقة جديدة بتشطيب راقي، في مجمع سكني هادئ، قريبة من المدارس."
      },
      {
        id: 6,
        title: "محل تجاري في حي الصحافة",
        type: "محل",
        district: "حي الصحافة",
        price: 1800000,
        area: 90,
        rooms: 1,
        coords: [46.6248, 24.8035],
        image: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800",
        desc: "محل تجاري على شارع رئيسي، واجهة زجاجية، حركة مرور عالية."
      }
    ];
    // ====== الخريطة ======
    mapboxgl.accessToken = 'pk.eyJ1IjoiYWFzYWRlIiwiYSI6ImNtdTdkaGhueDAwNHQyd3M4eWRkYzJteHoifQ.M6NHvQPVjZXBqPwxUhG_Rg';
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [46.6753, 24.7136],
      zoom: 10.5
    });
    map.addControl(new mapboxgl.NavigationControl(), 'top-left');
    map.addControl(new mapboxgl.GeolocateControl({
      positionOptions: {
        enableHighAccuracy: true
      },
      trackUserLocation: true
    }), 'top-left');
    let markers = [];

    function renderMarkers(list) {
      markers.forEach(m => m.remove());
      markers = [];
      list.forEach(p => {
        const el = document.createElement('div');
        el.style.cssText = `
      width: 36px; height: 36px; background: #d4af37;
      border: 3px solid white; border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg); cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      display: flex; align-items: center; justify-content: center;
    `;
        const inner = document.createElement('div');
        inner.style.cssText = 'transform: rotate(45deg); font-size: 16px;';
        inner.textContent = '🏠';
        el.appendChild(inner);
        el.addEventListener('click', () => openModal(p));
        const marker = new mapboxgl.Marker({
            element: el
          })
          .setLngLat(p.coords)
          .addTo(map);
        markers.push(marker);
      });
    }
    // ====== عرض العقارات ======
    function formatPrice(p) {
      return p.toLocaleString('ar-SA') + ' ريال';
    }

    function renderProperties(list) {
      const container = document.getElementById('propertiesList');
      container.innerHTML = '';
      if (list.length === 0) {
        container.innerHTML = '<p style="text-align:center;grid-column:1/-1;color:#888;padding:40px">لا توجد عقارات مطابقة</p>';
        return;
      }
      list.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(p);
        card.innerHTML = `
      <div class="card-img" style="background-image:url('${p.image}')">
        <span class="card-badge">${p.type}</span>
      </div>
      <div class="card-body">
        <h3>${p.title}</h3>
        <div class="price">${formatPrice(p.price)}</div>
        <div class="card-info">
          <span>📍 ${p.district}</span>
          <span>📐 ${p.area} م²</span>
          ${p.rooms > 0 ? `<span>🛏 ${p.rooms} غرف</span>` : ''}
        </div>
        <span class="card-btn">التفاصيل</span>
      </div>
    `;
        container.appendChild(card);
      });
    }
    // ====== النافذة المنبثقة ======
    function openModal(p) {
      document.getElementById('modalImg').src = p.image;
      document.getElementById('modalTitle').textContent = p.title;
      document.getElementById('modalPrice').textContent = formatPrice(p.price);
      document.getElementById('modalDesc').textContent = p.desc;
      document.getElementById('modalType').textContent = p.type;
      document.getElementById('modalArea').textContent = p.area + ' م²';
      document.getElementById('modalDistrict').textContent = p.district;
      document.getElementById('modalRooms').textContent = p.rooms > 0 ? p.rooms + ' غرف' : '—';
      const msg = encodeURIComponent(`السلام عليكم، مهتم بـ: ${p.title} - السعر: ${formatPrice(p.price)}`);
      document.getElementById('modalWhatsapp').href = `https://wa.me/966552500035?text=${msg}`;
      document.getElementById('modal').classList.add('active');
      map.flyTo({
        center: p.coords,
        zoom: 14,
        speed: 1.2
      });
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });
    // ====== الفلترة ======
    function applyFilters() {
      const type = document.getElementById('filterType').value;
      const district = document.getElementById('filterDistrict').value;
      const priceRange = document.getElementById('filterPrice').value;
      let filtered = properties.filter(p => {
        if (type && p.type !== type) return false;
        if (district && p.district !== district) return false;
        if (priceRange) {
          const [min, max] = priceRange.split('-').map(Number);
          if (p.price < min || p.price > max) return false;
        }
        return true;
      });
      renderProperties(filtered);
      renderMarkers(filtered);
    }
    document.getElementById('filterType').addEventListener('change', applyFilters);
    document.getElementById('filterDistrict').addEventListener('change', applyFilters);
    document.getElementById('filterPrice').addEventListener('change', applyFilters);
    // ====== التشغيل ======
    map.on('load', () => {
      renderMarkers(properties);
      renderProperties(properties);
    });
  </script>

</body>

</html>
